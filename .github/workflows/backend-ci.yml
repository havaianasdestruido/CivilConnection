name: Backend CI

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'src/back/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'src/back/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/back
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify backend
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon ktlintCheck detekt test build 2>&1 | tee backend-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## Backend build failure'
              echo '<details><summary>Last 300 lines</summary>'
              echo
              echo '```text'
              tail -300 backend-build.log
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
