name: Backend CI

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'src/back/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'src/back/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify backend
        run: ./gradlew --no-daemon ktlintCheck detekt test build
